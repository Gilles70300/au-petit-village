<app-header></app-header>

<h1>Accueil</h1>

<button (click)="orderBy = orderBy === 'asc' ? 'desc' : 'asc'">
    Tri par prix croissant/décroissant
</button>

<ul>
    <li *ngFor="let p of prices | sortByPrice: orderBy">
        {{ p.name }} - {{ p.price }}
    </li>
</ul>

<app-footer></app-footer>
